<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200" fill="none">
  <defs>
    <linearGradient id="s2-card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="s2-archive-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="s2-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="16" y="16" width="248" height="168" rx="16" fill="url(#s2-card-bg)" filter="url(#s2-shadow)"/>
  <rect x="16" y="16" width="248" height="168" rx="16" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Step badge -->
  <rect x="32" y="32" width="52" height="22" rx="11" fill="#F1F5F9"/>
  <text x="58" y="47" font-family="Georgia, serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">Step 2</text>

  <!-- Attacker node — left -->
  <g transform="translate(62, 90)">
    <!-- Skull-ish threat actor indicator -->
    <circle cx="0" cy="0" r="20" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
    <!-- Simple threat actor icon - antenna + box -->
    <rect x="-8" y="-5" width="16" height="12" rx="3" fill="#EF4444" opacity="0.8"/>
    <line x1="0" y1="-5" x2="0" y2="-13" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-14" r="2" fill="#EF4444"/>
    <rect x="-4" y="-1" width="8" height="2" rx="1" fill="white" opacity="0.6"/>
    <!-- Capture arrow -->
    <path d="M 22 0 L 38 0" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 2"/>
    <polygon points="38,-3.5 46,0 38,3.5" fill="#94A3B8"/>
  </g>

  <!-- Intercepted data packet (copy) -->
  <g transform="translate(112, 82)" opacity="0.6">
    <rect x="-12" y="-10" width="24" height="20" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="-7" y="-5" width="14" height="2" rx="1" fill="#3B82F6" opacity="0.5"/>
    <rect x="-7" y="0" width="10" height="2" rx="1" fill="#3B82F6" opacity="0.4"/>
    <rect x="-7" y="5" width="12" height="2" rx="1" fill="#3B82F6" opacity="0.3"/>
  </g>

  <!-- Cold archive box — right -->
  <g transform="translate(200, 90)">
    <!-- Archive box -->
    <rect x="-26" y="-22" width="52" height="40" rx="6" fill="url(#s2-archive-grad)"/>
    <!-- Archive lid -->
    <rect x="-28" y="-26" width="56" height="10" rx="4" fill="#475569"/>
    <!-- Lock band -->
    <rect x="-28" y="-10" width="56" height="4" rx="2" fill="#1E293B" opacity="0.5"/>
    <!-- Lid handle -->
    <rect x="-6" y="-31" width="12" height="8" rx="3" fill="#94A3B8"/>
    <!-- Status dots -->
    <circle cx="-8" cy="4" r="2" fill="#94A3B8" opacity="0.6"/>
    <circle cx="0" cy="4" r="2" fill="#94A3B8" opacity="0.6"/>
    <circle cx="8" cy="4" r="2" fill="#94A3B8" opacity="0.6"/>
  </g>

  <!-- Cold storage label -->
  <text x="200" y="128" font-family="'Courier New', monospace" font-size="9" fill="#94A3B8" text-anchor="middle" letter-spacing="0.5">COLD STORAGE</text>

  <!-- Title -->
  <text x="140" y="174" font-family="Georgia, serif" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">Attacker Harvests &amp; Stores</text>
</svg>
