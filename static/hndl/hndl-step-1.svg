<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200" fill="none">
  <defs>
    <linearGradient id="s1-card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="s1-lock-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="s1-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="s1-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="16" y="16" width="248" height="168" rx="16" fill="url(#s1-card-bg)" filter="url(#s1-shadow)"/>
  <rect x="16" y="16" width="248" height="168" rx="16" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Step badge -->
  <rect x="32" y="32" width="52" height="22" rx="11" fill="#EFF6FF"/>
  <text x="58" y="47" font-family="Georgia, serif" font-size="11" font-weight="600" fill="#3B82F6" text-anchor="middle">Step 1</text>

  <!-- Data packet — left side -->
  <g transform="translate(48, 90)">
    <rect x="-18" y="-14" width="36" height="28" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="-10" y="-7" width="20" height="3" rx="1.5" fill="#3B82F6" opacity="0.7"/>
    <rect x="-10" y="-1" width="14" height="3" rx="1.5" fill="#3B82F6" opacity="0.5"/>
    <rect x="-10" y="5" width="17" height="3" rx="1.5" fill="#3B82F6" opacity="0.4"/>
    <!-- Arrow moving right -->
    <g transform="translate(28, 0)">
      <line x1="0" y1="0" x2="18" y2="0" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 2"/>
      <polygon points="18,-4 26,0 18,4" fill="#CBD5E1"/>
    </g>
  </g>

  <!-- Lock icon — center -->
  <g transform="translate(140, 95)">
    <!-- Vault circle -->
    <circle cx="0" cy="0" r="30" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <!-- Lock body -->
    <rect x="-11" y="-4" width="22" height="17" rx="4" fill="url(#s1-lock-grad)"/>
    <!-- Lock shackle -->
    <path d="M -7 -4 L -7 -10 Q 0 -17 7 -10 L 7 -4" stroke="#1D4ED8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="0" cy="5" r="3" fill="white" opacity="0.6"/>
    <rect x="-1.5" y="5" width="3" height="5" rx="1" fill="white" opacity="0.6"/>
    <!-- Glow ring -->
    <circle cx="0" cy="0" r="30" stroke="#3B82F6" stroke-width="1" opacity="0.3" fill="none"/>
  </g>

  <!-- Encrypted label -->
  <text x="140" y="152" font-family="'Courier New', monospace" font-size="9" fill="#64748B" text-anchor="middle" letter-spacing="1">AES-256 ENCRYPTED</text>

  <!-- Title -->
  <text x="140" y="174" font-family="Georgia, serif" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">Data Encrypted Today</text>
</svg>
