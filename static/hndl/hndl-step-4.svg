<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200" fill="none">
  <defs>
    <linearGradient id="s4-card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8F8"/>
      <stop offset="100%" stop-color="#FEF2F2"/>
    </linearGradient>
    <radialGradient id="s4-risk-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="s4-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#EF4444" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="16" y="16" width="248" height="168" rx="16" fill="url(#s4-card-bg)" filter="url(#s4-shadow)"/>
  <rect x="16" y="16" width="248" height="168" rx="16" stroke="#FCA5A5" stroke-width="1.5"/>

  <!-- Risk glow background -->
  <circle cx="140" cy="95" r="70" fill="url(#s4-risk-glow)"/>

  <!-- Step badge -->
  <rect x="32" y="32" width="52" height="22" rx="11" fill="#FEE2E2"/>
  <text x="58" y="47" font-family="Georgia, serif" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle">Step 4</text>

  <!-- DANGER badge -->
  <rect x="184" y="32" width="64" height="22" rx="11" fill="#DC2626"/>
  <text x="216" y="47" font-family="Georgia, serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">⚠ EXPOSED</text>

  <!-- Open/broken lock -->
  <g transform="translate(100, 95)">
    <circle cx="0" cy="0" r="24" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5"/>
    <!-- Lock body - open/cracked -->
    <rect x="-10" y="-3" width="20" height="16" rx="4" fill="#EF4444" opacity="0.9"/>
    <!-- Open shackle -->
    <path d="M -6 -3 L -6 -10 Q -3 -16 4 -14" stroke="#DC2626" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Crack lines -->
    <line x1="-3" y1="2" x2="2" y2="8" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="2" y1="2" x2="-1" y2="8" stroke="white" stroke-width="1" opacity="0.4"/>
    <!-- Keyhole broken -->
    <circle cx="0" cy="6" r="3" fill="#DC2626"/>
  </g>

  <!-- Exposed data flowing out -->
  <g transform="translate(160, 80)" opacity="0.85">
    <rect x="0" y="0" width="30" height="22" rx="4" fill="white" stroke="#FCA5A5" stroke-width="1.5"/>
    <rect x="4" y="5" width="22" height="2.5" rx="1" fill="#EF4444" opacity="0.6"/>
    <rect x="4" y="10" width="16" height="2.5" rx="1" fill="#EF4444" opacity="0.5"/>
    <rect x="4" y="15" width="19" height="2.5" rx="1" fill="#EF4444" opacity="0.4"/>
    <!-- Leak arrows -->
    <line x1="15" y1="22" x2="8" y2="32" stroke="#FCA5A5" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="15" y1="22" x2="22" y2="32" stroke="#FCA5A5" stroke-width="1" stroke-dasharray="2 2"/>
  </g>

  <!-- Risk meter bar -->
  <rect x="40" y="148" width="200" height="6" rx="3" fill="#FEE2E2"/>
  <rect x="40" y="148" width="180" height="6" rx="3" fill="#EF4444"/>
  <!-- Risk label -->
  <text x="40" y="165" font-family="'Courier New', monospace" font-size="9" fill="#DC2626" letter-spacing="0.5">RISK LEVEL</text>
  <text x="240" y="165" font-family="'Courier New', monospace" font-size="9" fill="#DC2626" text-anchor="end" letter-spacing="0.5" font-weight="700">CRITICAL</text>

  <!-- Title -->
  <text x="140" y="181" font-family="Georgia, serif" font-size="12" font-weight="600" fill="#991B1B" text-anchor="middle">Encryption Broken — Data Exposed</text>
</svg>
