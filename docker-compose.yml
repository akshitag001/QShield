version: '3.8'

services:
  # ======================================================================
  # OPTION 1: SQLite Deployment (Default, Persistent, Zero-Configuration)
  # ======================================================================
  qshield:
    build:
      context: .
      dockerfile: Dockerfile
    image: qshield:latest
    container_name: qshield-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/qshield.db
    volumes:
      - qshield-data:/data

