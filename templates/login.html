<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Shield | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl shadow-sm p-8">
        <div class="mb-6 text-center">
            <h1 class="text-2xl font-semibold text-gray-900">Q-Shield Login</h1>
            <p class="text-sm text-gray-500 mt-1">Sign in to access scanner and scan history</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded-xl bg-red-50 text-red-700 border border-red-200 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <!-- Google Sign-In Button -->
        <div id="firebase-signin-container" class="mb-6"></div>

        <!-- Divider -->
        <div class="auth-divider mb-6">
            <span>or</span>
        </div>

        <!-- Traditional Login Form -->
        <form method="post" action="/login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="username">Username</label>
                <input id="username" name="username" type="text" required class="w-full px-3 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-300" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
                <input id="password" name="password" type="password" required class="w-full px-3 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-300" />
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-gray-900 text-white font-medium hover:bg-gray-800 transition">
                Sign In
            </button>
        </form>
    </div>

    <!-- Firebase Authentication Styles and Scripts -->
    <style>
        .google-signin-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 24px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            color: #3c4043;
            background-color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .google-signin-button:hover {
            border-color: #4285f4;
            background-color: #f8f9fa;
            box-shadow: 0 2px 8px rgba(66, 133, 244, 0.2);
        }

        .google-signin-button:active {
            background-color: #f1f3f4;
        }

        .google-signin-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #999;
        }

        .auth-divider span {
            white-space: nowrap;
            font-size: 14px;
            font-weight: 500;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #e0e0e0;
        }
    </style>

    <script type="module">
        import { attachGoogleSignInButton, getGoogleSignInStyles } from "/static/firebase_auth/ui.js";
        
        // Attach Google Sign-In button
        attachGoogleSignInButton('firebase-signin-container');
    </script>
</body>
</html>
